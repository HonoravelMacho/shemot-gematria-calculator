[package]
name = "shemot-app"
version = "1.0.0"
description = "Shemot Gematria Search Engine"
authors = ["Shemot Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
tauri = { version = "1.6", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gematria = { package = "shemot", path = "../shemot-rust" }

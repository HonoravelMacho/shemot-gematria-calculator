[package]
name = "shemot-app"
version = "1.0.5"
description = "Shemot Gematria Search Engine"
authors = ["Shemot Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gematria = { package = "shemot", path = "../shemot-rust" }

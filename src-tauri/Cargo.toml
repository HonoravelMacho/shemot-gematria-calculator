[package]
name = "shemot-app"
version = "1.0.11"
description = "Shemot Gematria Search Engine"
authors = ["Shemot Team"]
edition = "2021"

[lib]
name = "shemot_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gematria = { package = "shemot", path = "../shemot-rust" }
tauri-plugin-fs = "2.6.0"
tauri-plugin-dialog = "2.8.0"
